services:
  mysql:
    image: mysql:8.4
    container_name: speakcity-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: speakcity
      MYSQL_USER: speakcity
      MYSQL_PASSWORD: speakcity
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      retries: 20
volumes:
  mysql-data:
